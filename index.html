<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ポケモンカードBOX買取表メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{ --gold:#E8C15A; --ink:#F7F4EC; --muted:#C9A24A; --line:#2A3E68; }
  *{box-sizing:border-box}
  body{margin:0; background:#060606; color:var(--ink); font-family:"Noto Sans JP",sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:16px; padding:20px 12px 60px;}

  .panel{width:100%; max-width:1000px; background:#111; border:1px solid #333; border-radius:14px;
    padding:14px 16px; display:flex; flex-direction:column; gap:10px;}
  .line{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .panel input[type=text]{flex:1; min-width:120px; background:#0b0b0b; color:var(--ink); border:1px solid #333;
    border-radius:8px; padding:9px 11px; font-family:inherit; font-size:13px;}
  .panel select{background:#0b0b0b; color:var(--ink); border:1px solid #333; border-radius:8px; padding:9px 11px; font-size:13px; min-width:160px;}
  .btn{border:0; border-radius:8px; padding:9px 15px; font-family:inherit; font-weight:700; font-size:13px; cursor:pointer; white-space:nowrap}
  .btn-main{background:var(--gold); color:#241c07}
  .btn-sub{background:#2a2a2a; color:var(--ink)}
  .btn:active{transform:translateY(1px)}
  .lbl{font-size:12px; color:var(--muted); font-weight:700}
  .status{font-size:13px; color:#aaa}
  .status.err{color:#ff7a7a}
  label.chk{display:flex; align-items:center; gap:6px; font-size:13px; color:#aaa; cursor:pointer}
  .hint{font-size:12px; color:#888}

  #results{width:100%; max-width:1000px; display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px}
  #results:empty{display:none}
  .rcard{background:#111; border:1px solid #333; border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:7px}
  .rcard img{width:100%; height:100px; object-fit:contain; background:#0b0b0b; border-radius:6px}
  .rname{font-size:12px; line-height:1.3; height:3.1em; overflow:hidden; color:var(--ink)}
  .rprice{font-size:14px; color:var(--gold); font-weight:700}
  .rmin{font-size:11px; color:#888; font-weight:400}
  .rbtns{display:flex; gap:6px; margin-top:auto}
  .rbtns .btn{flex:1; padding:8px 0; font-size:12px}

  /* ===== 画面表示の縮小(出力はA4のまま) ===== */
  .holder{ position:relative; margin:0 auto; overflow:hidden; }
  /* ===== A4縦キャンバス(1240x1754) ===== */
  #board{width:1240px; height:1754px; position:absolute; top:0; left:0; transform-origin:top left;
    overflow:hidden; color:var(--ink); background:#ffffff center/cover no-repeat;
    display:flex; flex-direction:column; padding:52px 108px 96px;}
  .hd{flex:none}
  .tag{display:inline-block; background:var(--gold); color:#241c07; font-weight:900; font-size:18px;
    letter-spacing:2px; padding:4px 12px; border-radius:6px; outline:none}
  .title{font-weight:900; font-size:46px; line-height:1.04; margin:10px 0 6px; outline:none}
  .sub{display:flex; align-items:baseline; gap:18px}
  .shop{font-weight:700; font-size:22px; outline:none}
  .date{font-weight:700; font-size:18px; color:var(--gold); outline:none}

  .gridwrap{flex:1; display:flex; align-items:center; justify-content:center; min-height:0; overflow:hidden}
  .grid{width:100%; display:grid; gap:12px}
  .grid.g2{grid-template-columns:repeat(2,1fr)}
  .grid.g3{grid-template-columns:repeat(3,1fr)}
  .grid.g4{grid-template-columns:repeat(4,1fr)}
  .grid.g5{grid-template-columns:repeat(5,1fr)}
  .cell{background:rgba(6,8,14,.42); border:1px solid rgba(232,193,90,.32); border-radius:12px;
    padding:10px 8px 12px; text-align:center; position:relative}
  .imgbox{display:flex; align-items:center; justify-content:center; margin-bottom:8px}
  .imgbox img,.imgbox .noimg{width:100%; object-fit:contain; border-radius:6px}
  .imgbox .noimg{background:rgba(255,255,255,.04)}
  .nm{font-weight:700; color:var(--ink); line-height:1.25; outline:none;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .pr{font-weight:900; color:var(--gold); margin-top:4px; white-space:nowrap}
  .pr .y{font-size:.58em; margin-right:1px; vertical-align:.14em}
  .mn{display:block; color:var(--muted); font-weight:700; opacity:.85; margin-top:2px}
  .bad .pr{color:#ff7a7a; font-size:20px}

  .g2 .imgbox img,.g2 .imgbox .noimg{height:260px} .g2 .nm{font-size:24px} .g2 .pr{font-size:44px} .g2 .mn{font-size:17px}
  .g3 .imgbox img,.g3 .imgbox .noimg{height:180px} .g3 .nm{font-size:19px} .g3 .pr{font-size:33px} .g3 .mn{font-size:14px}
  .g4 .imgbox img,.g4 .imgbox .noimg{height:128px} .g4 .nm{font-size:16px} .g4 .pr{font-size:26px} .g4 .mn{font-size:12px}
  .g5 .imgbox img,.g5 .imgbox .noimg{height:96px}  .g5 .nm{font-size:14px} .g5 .pr{font-size:21px} .g5 .mn{font-size:11px}

  .rm{position:absolute; top:5px; right:5px; width:22px; height:22px; border-radius:50%; border:0;
    background:#5a2030; color:#ff9a9a; cursor:pointer; font-size:14px; line-height:1; z-index:3}
  .ed{position:absolute; top:5px; left:5px; border:0; background:#2c2c2a; color:var(--gold);
    border-radius:6px; font-size:11px; padding:3px 7px; cursor:pointer; z-index:3}
  .drag{position:absolute; top:5px; left:50%; transform:translateX(-50%); color:#cbb26a;
    background:#22262e; border-radius:6px; padding:1px 9px; font-size:15px; line-height:1.2;
    cursor:grab; touch-action:none; user-select:none; z-index:3}
  .cell.dragging{opacity:.4}
  .cell.dropzone{outline:2px dashed var(--gold); outline-offset:-2px}
  body.exporting .rm, body.exporting .ed, body.exporting .drag{display:none}

  .ft{flex:none; display:flex; justify-content:center; align-items:center; gap:16px; padding-top:8px}
  .note{font-size:18px; font-weight:700; outline:none}
  .handle{font-size:19px; color:var(--muted); font-weight:700; outline:none}
  .empty{padding:60px 8px; text-align:center; color:var(--muted); font-size:24px}

  /* ==== デザイン変更: ロゴヘッダー / 54枚グリッド / フッター ==== */
  .hd{ text-align:center; }
  .logo{ display:block; width:600px; max-width:92%; height:auto; margin:0 auto 8px; }
  .sub{ justify-content:center; }
  .note{ font-size:15px; line-height:1.35; max-width:860px; }
  .grid.g6{grid-template-columns:repeat(6,1fr)}
  .grid.g7{grid-template-columns:repeat(7,1fr)}
  .grid.g8{grid-template-columns:repeat(8,1fr)}
  .grid.g9{grid-template-columns:repeat(9,1fr)}
  .grid{gap:10px}
  .g6 .imgbox img,.g6 .imgbox .noimg{height:104px} .g6 .nm{font-size:13px} .g6 .pr{font-size:19px}
  .g7 .imgbox img,.g7 .imgbox .noimg{height:88px}  .g7 .nm{font-size:12px} .g7 .pr{font-size:17px}
  .g8 .imgbox img,.g8 .imgbox .noimg{height:74px}  .g8 .nm{font-size:11px} .g8 .pr{font-size:15px}
  .g9 .imgbox img,.g9 .imgbox .noimg{height:64px}  .g9 .nm{font-size:10px} .g9 .pr{font-size:13px}

  /* ==== v2: 画像主役・中央寄せ・価格帯 ==== */
  .gridwrap{align-items:center; justify-content:center}
  .grid{width:auto; max-width:100%; margin:0 auto; justify-content:center; gap:6px}
  .cell{padding:0 0 8px; overflow:hidden}
  .imgbox{width:100%; margin:0 0 5px}
  .imgbox img,.imgbox .noimg{width:100%!important; height:100%!important; object-fit:contain}
  .noimg{background:rgba(255,255,255,.05)}
  .nm{padding:0 6px}
  .pr{display:inline-block; background:linear-gradient(180deg,#ffe07a,#e6b23c); color:#3a2600;
      border-radius:999px; padding:2px 16px; margin-top:4px; box-shadow:0 1px 2px rgba(0,0,0,.35); white-space:nowrap}
  .pr .y{color:#3a2600; font-size:.62em}
  .grid.g1{grid-template-columns:repeat(1,340px)} .g1 .imgbox{height:470px} .g1 .nm{font-size:20px} .g1 .pr{font-size:34px}
  .grid.g2{grid-template-columns:repeat(2,330px)} .g2 .imgbox{height:456px} .g2 .nm{font-size:19px} .g2 .pr{font-size:32px}
  .grid.g3{grid-template-columns:repeat(3,300px)} .g3 .imgbox{height:414px} .g3 .nm{font-size:18px} .g3 .pr{font-size:30px}
  .grid.g4{grid-template-columns:repeat(4,238px)} .g4 .imgbox{height:328px} .g4 .nm{font-size:15px} .g4 .pr{font-size:24px}
  .grid.g5{grid-template-columns:repeat(5,186px)} .g5 .imgbox{height:258px} .g5 .nm{font-size:13px} .g5 .pr{font-size:20px}
  .grid.g6{grid-template-columns:repeat(6,140px)} .g6 .imgbox{height:190px} .g6 .nm{font-size:12px} .g6 .pr{font-size:18px}
  .grid.g7{grid-template-columns:repeat(7,110px)} .g7 .imgbox{height:150px} .g7 .nm{font-size:11px} .g7 .pr{font-size:15px}
  .grid.g8{grid-template-columns:repeat(8,110px)} .g8 .imgbox{height:150px} .g8 .nm{font-size:10px} .g8 .pr{font-size:14px}
  .grid.g9{grid-template-columns:repeat(9,104px)} .g9 .imgbox{height:144px} .g9 .nm{font-size:10px} .g9 .pr{font-size:13px}

  /* ==== v3: 横幅いっぱいに画像最大化(少数は上限・多数は収まり優先) ==== */
  .grid{width:100%; max-width:100%; margin:0; gap:6px}
  /* 列は全幅を均等分割(1fr)。カード幅=(全幅-余白)/列数 で最大化 */
  .grid.g1{grid-template-columns:repeat(1,minmax(0,360px)); justify-content:center; width:auto; margin:0 auto}
  .grid.g2{grid-template-columns:repeat(2,minmax(0,360px)); justify-content:center; width:auto; margin:0 auto}
  .grid.g3{grid-template-columns:repeat(3,minmax(0,330px)); justify-content:center; width:auto; margin:0 auto}
  .grid.g4{grid-template-columns:repeat(4,1fr)}
  .grid.g5{grid-template-columns:repeat(5,1fr)}
  .grid.g6{grid-template-columns:repeat(6,1fr)}
  .grid.g7{grid-template-columns:repeat(7,1fr)}
  .grid.g8{grid-template-columns:repeat(8,1fr)}
  .grid.g9{grid-template-columns:repeat(9,1fr)}
  /* 画像はカード幅に追従(ポケカ比 5:7)。高さ指定は解除して幅基準に */
  .imgbox{width:100%; height:auto!important; aspect-ratio:5/7; margin:0 0 5px}
  .imgbox img,.imgbox .noimg{width:100%!important; height:100%!important; object-fit:contain}
  .g1 .imgbox,.g2 .imgbox,.g3 .imgbox,.g4 .imgbox,.g5 .imgbox,.g6 .imgbox,.g7 .imgbox,.g8 .imgbox,.g9 .imgbox{height:auto!important}
  /* 多数時に縦がはみ出さないよう、行数の多い密度は画像上限を付ける */
  .grid.g7 .imgbox{max-height:150px} .grid.g8 .imgbox{max-height:150px} .grid.g9 .imgbox{max-height:140px}
  .grid.g6 .imgbox{max-height:196px} .grid.g5 .imgbox{max-height:250px} .grid.g4 .imgbox{max-height:340px}

  /* ==== v4: 左上バッジ / ヘッダー上げ / 価格収まり ==== */
  #corner{ position:absolute; top:44px; left:44px; z-index:5; display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
  #corner .cdate{ background:var(--gold); color:#241c07; font-weight:900; font-size:20px; padding:4px 12px; border-radius:6px; outline:none; }
  #corner .cshop{ font-weight:700; font-size:22px; color:var(--ink); outline:none; }
  .hd{ text-align:center; margin-top:6px; }
  /* 価格が見切れないよう、行数の多い密度は画像上限をさらに下げる */
  .grid.g4 .imgbox{max-height:322px} .grid.g5 .imgbox{max-height:232px} .grid.g6 .imgbox{max-height:178px}
  .grid.g7 .imgbox{max-height:140px} .grid.g8 .imgbox{max-height:138px} .grid.g9 .imgbox{max-height:130px}

  /* ==== v5: 価格帯を金ベタ(影なし) / 画像の歪み解消(比率保持) ==== */
  .pr{ background:#e8c15a !important; background-image:none !important; color:#241606 !important;
       box-shadow:none !important; border-radius:8px; padding:2px 14px; }
  .pr .y{ color:#241606 !important; }
  /* 画像枠は固定高さ + contain で歪ませない(aspect-ratioを無効化) */
  .imgbox{ aspect-ratio:auto !important; }
  .imgbox img,.imgbox .noimg{ width:100% !important; height:100% !important; object-fit:contain !important; }
  /* 各密度の画像枠の高さ(比率は画像側でcontain維持) */
  .g1 .imgbox{height:470px !important} .g2 .imgbox{height:452px !important} .g3 .imgbox{height:410px !important}
  .g4 .imgbox{height:322px !important} .g5 .imgbox{height:232px !important} .g6 .imgbox{height:178px !important}
  .g7 .imgbox{height:140px !important} .g8 .imgbox{height:138px !important} .g9 .imgbox{height:130px !important}

  /* ==== v6: 白背景用の文字色・カード ==== */
  #board{ color:#1a1a1a; }
  #board .nm, #corner .cshop{ color:#1a1a1a; }
  #board .handle, #board .mn{ color:#8a6a1c; }
  #board .cell{ background:#f6f6f6; border-color:rgba(184,140,40,.45); }
  #board .noimg{ background:rgba(0,0,0,.05); }
  #board .empty{ color:#8a6a1c; }
</style>
</head>
<body>

  <div class="panel">
    <div class="line">
      <input id="api" type="text" placeholder="GASウェブアプリのURL (.../exec)"
        value="https://script.google.com/macros/s/AKfycbxy_D2iGSW9l68geziP9W8YRy2XsJlECJ79KbuW59RixFKzxzdasY7CMOQWIQH-jgrS3Q/exec">
      <button class="btn btn-sub" onclick="load()">シートから読み込み</button>
    </div>
    <div class="line">
      <input id="q" type="text" placeholder="商品名で検索（例: ポケモンカード box）" onkeydown="if(event.key==='Enter')doSearch()">
      <button class="btn btn-sub" onclick="doSearch()">検索</button>
    </div>
    <div class="line">
      <span class="lbl">テンプレート</span>
      <select id="tplSel"><option value="">（選択）</option></select>
      <button class="btn btn-sub" onclick="tplLoad()">読込</button>
      <button class="btn btn-sub" onclick="tplSave()">現在の内容を保存</button>
      <button class="btn btn-sub" onclick="tplDel()">削除</button>
    </div>
    <div class="line">
      <span class="lbl">背景</span>
      <input type="file" id="bgFile" accept="image/*" onchange="bgUpload(event)" style="font-size:12px;color:#aaa">
      <button class="btn btn-sub" onclick="bgReset()">既定に戻す</button>
      <label class="chk"><input type="checkbox" id="showMin" onchange="render()"> 最安値も表示</label>
      <span style="flex:1"></span>
      <button class="btn btn-sub" onclick="copyForX()">Xポスト用にコピー</button>
      <button class="btn btn-main" onclick="exportPng()">画像を保存</button>
    </div>
    <div id="status" class="status">「シートから読み込み」または「検索」でBOXを追加。カード上部の⠿を掴むと並べ替えできます。</div>
  </div>

  <div id="results"></div>

  <div class="stage">
    <div class="holder" id="holder">
      <div id="board">
              <div id="corner">

        <div class="ft">
          <span class="note" contenteditable="true">買取価格はカードの状態・在庫状況・相場の変動によって変更になる場合がございます。予めご了承ください。</span>

<script>
  var BG_DEFAULT = '';  // 既定は白背景(画像なし)
  var items = [];
  var lastResults = [];
  var MAX = 54;

  document.getElementById('board').style.backgroundImage = BG_DEFAULT ? 'url(' + BG_DEFAULT + ')' : 'none';
  (function(){ var d=new Date();
    document.getElementById('date').textContent = d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate()+' 時点'; })();

  function apiUrl(){ return document.getElementById('api').value.trim(); }
  function setStatus(m,e){ var el=document.getElementById('status'); el.textContent=m; el.className='status'+(e?' err':''); }
  function yen(n){ return Number(n).toLocaleString('ja-JP'); }
  function isNum(v){ return typeof v==='number' || /^\d+$/.test(String(v).replace(/,/g,'')); }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function colsFor(n){ return n<=1?1 : n<=2?2 : n<=6?3 : n<=12?4 : n<=20?5 : n<=30?6 : n<=42?7 : n<=48?8 : 9; }

  // HTMLエンティティを戻す(&amp; 等)
  function decodeEnt(s){ var t=document.createElement('textarea'); t.innerHTML=String(s); return t.value; }
  // 「」内の弾名だけを取り出す。無ければ元の名前(エンティティ復元済み)
  function shortName(raw){
    var s=decodeEnt(raw);
    var m=s.match(/[「『]([^」』]+)[」』]/);
    return m ? m[1] : s;
  }
  function dispName(it){
    if(it.custom) return it.name;
    var n=shortName(it.name || '');
    return (n && n.trim()) ? n : ('商品 '+it.id);
  }

  // ===== 画面表示スケール(出力はA4のまま) =====
  function fitBoard(){
    var maxW=Math.min(760,(window.innerWidth||1240)-24);
    var s=maxW/1240; if(s>0.66) s=0.66;
    document.getElementById('board').style.transform='scale('+s+')';
    var h=document.getElementById('holder');
    h.style.width=(1240*s)+'px'; h.style.height=(1754*s)+'px';
  }
  window.addEventListener('resize', fitBoard);

  function jsonp(base, params){
    return new Promise(function(resolve, reject){
      if(!base){ reject(new Error('URL未設定')); return; }
      var cb='jsonp_'+Math.random().toString(36).slice(2);
      var qs=[]; Object.keys(params||{}).forEach(function(k){ qs.push(encodeURIComponent(k)+'='+encodeURIComponent(params[k])); });
      qs.push('callback='+cb);
      var url=base+(base.indexOf('?')>-1?'&':'?')+qs.join('&');
      var s=document.createElement('script');
      var t=setTimeout(function(){ cleanup(); reject(new Error('タイムアウト')); }, 30000);
      window[cb]=function(d){ clearTimeout(t); cleanup(); resolve(d); };
      s.onerror=function(){ clearTimeout(t); cleanup(); reject(new Error('通信エラー')); };
      function cleanup(){ try{delete window[cb];}catch(e){window[cb]=undefined;} if(s.parentNode) s.parentNode.removeChild(s); }
      s.src=url; document.body.appendChild(s);
    });
  }

  function load(){
    setStatus('読み込み中…');
    jsonp(apiUrl(), {}).then(function(d){
      items=(d.items||[]).filter(function(x){ return x.buy!=='' && x.buy!=null; });
      setStatus(items.length? items.length+'件を読み込みました。':'シートが空でした。検索で追加してください。');
      render(); tplRefresh();
    }).catch(function(e){ setStatus('読み込み失敗: '+e.message,true); });
  }

  function doSearch(){
    var q=document.getElementById('q').value.trim();
    if(!q){ setStatus('検索キーワードを入力してください。',true); return; }
    setStatus('検索中…');
    jsonp(apiUrl(), {action:'search', q:q}).then(function(d){
      lastResults=d.items||[]; renderResults();
      setStatus(lastResults.length? lastResults.length+'件ヒット。「保存」でシート登録、「一時追加」でこの画像だけに追加。':'ヒットなし。',!lastResults.length);
    }).catch(function(e){ setStatus('検索失敗: '+e.message,true); });
  }

  function renderResults(){
    document.getElementById('results').innerHTML = lastResults.map(function(it,i){
      var price=it.buy!=null? '買取 ¥'+yen(it.buy) : '価格取得不可';
      var min=it.min!=null? ' <span class="rmin">(最安¥'+yen(it.min)+')</span>' : '';
      return '<div class="rcard">'+
        (it.src?'<img src="'+it.src+'" alt="">':'<div style="height:100px;background:#0b0b0b;border-radius:6px"></div>')+
        '<div class="rname">'+esc(shortName(it.name))+'</div>'+
        '<div class="rprice">'+price+min+'</div>'+
        '<div class="rbtns">'+
          '<button class="btn btn-sub" onclick="pick('+i+',0)">一時追加</button>'+
          '<button class="btn btn-main" onclick="pick('+i+',1)">保存</button>'+
        '</div></div>';
    }).join('');
  }

  function pick(i, act){
    var it=lastResults[i]; if(!it) return;
    if(items.some(function(x){ return String(x.id).indexOf(it.id)!==-1; })){ setStatus(shortName(it.name)+' は既に表にあります。'); return; }
    if(items.length>=MAX){ setStatus('最大'+MAX+'件までです。',true); return; }
    if(act===0){
      items.push({id:it.id, name:it.name, img:it.img, src:it.src, min:it.min, buy:it.buy});
      render(); setStatus(shortName(it.name)+' を一時追加しました。');
    }else{
      setStatus('保存中…');
      jsonp(apiUrl(), {action:'add', id:it.id, name:it.name, img:it.img}).then(function(r){
        if(r.status==='added'||r.status==='updated'){
          items.push({id:it.id, name:r.name, img:r.img, src:r.src, min:r.min, buy:r.buy});
          render(); setStatus(shortName(it.name)+' を保存しました（次回から自動更新）。');
        }else setStatus('保存失敗: '+(r.error||'不明'),true);
      }).catch(function(e){ setStatus('保存失敗: '+e.message,true); });
    }
  }

  function render(){
    var wrap=document.getElementById('rows');
    var showMin=document.getElementById('showMin').checked;
    var list=items.slice(0,MAX);
    if(!list.length){ wrap.className='grid g3'; wrap.innerHTML='<div class="empty">読み込みか検索でBOXを追加してください。</div>'; return; }
    wrap.className='grid g'+colsFor(list.length);
    wrap.innerHTML='';
    list.forEach(function(it,i){
      var bad=!isNum(it.buy);
      var thumb=it.src? '<img src="'+it.src+'" alt="" onerror="imgErr(this)">' : '<div class="noimg"></div>';
      var mn=(showMin&&isNum(it.min))? '<span class="mn">最安 ¥'+yen(it.min)+'</span>':'';
      var pr=bad? '<div class="pr">取得失敗</div>' : '<div class="pr"><span class="y">¥</span>'+yen(it.buy)+'</div>'+mn;
      var cell=document.createElement('div');
      cell.className='cell'+(bad?' bad':'');
      cell.setAttribute('data-idx', i);
      cell.innerHTML=
        '<div class="drag" title="ドラッグで移動">⠿</div>'+
        '<button class="rm" title="消す" onclick="removeRow('+i+')">×</button>'+
        '<button class="ed" onclick="editPrice('+i+')">変更</button>'+
        '<div class="imgbox">'+thumb+'</div>'+
        '<div class="nm" contenteditable="true" onblur="syncName('+i+',this)">'+esc(dispName(it))+'</div>'+pr;
      wrap.appendChild(cell);
    });
  }
  function removeRow(i){ items.splice(i,1); render(); }
  function syncName(i,el){ if(items[i]){ items[i].name=el.textContent; items[i].custom=true; } }
  function editPrice(i){
    if(!items[i]) return;
    var v=prompt('買取価格（円）を入力', items[i].buy);
    if(v===null) return;
    v=String(v).replace(/[^\d]/g,''); if(v==='') return;
    items[i].buy=Number(v); render();
  }
  function imgErr(el){ var d=document.createElement('div'); d.className='noimg'; if(el.parentNode) el.parentNode.replaceChild(d,el); }

  // ===== ドラッグ&ドロップ並べ替え(マウス/タッチ両対応) =====
  (function(){
    var rows=document.getElementById('rows');
    var dragIdx=null, dragCell=null;
    rows.addEventListener('pointerdown', function(e){
      var h=e.target.closest('.drag'); if(!h) return;
      var cell=h.closest('.cell'); if(!cell) return;
      e.preventDefault();
      dragIdx=+cell.getAttribute('data-idx'); dragCell=cell;
      cell.classList.add('dragging');
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
    function cellAt(x,y){
      var el=document.elementFromPoint(x,y);
      return (el&&el.closest)? el.closest('.cell') : null;
    }
    function onMove(e){
      var c=cellAt(e.clientX,e.clientY);
      Array.prototype.forEach.call(rows.querySelectorAll('.cell'),function(x){ x.classList.remove('dropzone'); });
      if(c && c!==dragCell) c.classList.add('dropzone');
    }
    function onUp(e){
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      var c=cellAt(e.clientX,e.clientY);
      if(dragIdx!=null && c){
        var to=+c.getAttribute('data-idx');
        if(!isNaN(to) && to!==dragIdx){
          var m=items.splice(dragIdx,1)[0];
          items.splice(to,0,m);
        }
      }
      dragIdx=null; dragCell=null; render();
    }
  })();

  /* ---- テンプレート ---- */
  function tplRefresh(){
    jsonp(apiUrl(), {action:'tpl_list'}).then(function(d){
      var sel=document.getElementById('tplSel'); var cur=sel.value;
      sel.innerHTML='<option value="">（選択）</option>'+(d.names||[]).map(function(n){ return '<option value="'+esc(n)+'">'+esc(n)+'</option>'; }).join('');
      sel.value=cur;
    }).catch(function(){});
  }
  function tplLoad(){
    var name=document.getElementById('tplSel').value;
    if(!name){ setStatus('テンプレートを選択してください。',true); return; }
    setStatus('テンプレート「'+name+'」を読込中（最安値を再取得）…');
    jsonp(apiUrl(), {action:'tpl_load', name:name}).then(function(d){
      items=(d.items||[]); render();
      setStatus('テンプレート「'+name+'」を読み込みました（'+items.length+'件・買取価格は最新に再計算）。');
    }).catch(function(e){ setStatus('読込失敗: '+e.message,true); });
  }
  function tplSave(){
    if(!items.length){ setStatus('保存する商品がありません。',true); return; }
    var name=prompt('テンプレート名を入力（同名は上書き）');
    if(!name) return;
    var payload=JSON.stringify(items.slice(0,MAX).map(function(x){ return {id:String(x.id), name:x.name||'', img:x.img||''}; }));
    setStatus('保存中…');
    jsonp(apiUrl(), {action:'tpl_save', name:name, items:payload}).then(function(r){
      if(r.status==='saved'){ setStatus('テンプレート「'+name+'」を保存しました。'); tplRefresh(); }
      else setStatus('保存失敗: '+(r.error||'不明'),true);
    }).catch(function(e){ setStatus('保存失敗: '+e.message,true); });
  }
  function tplDel(){
    var name=document.getElementById('tplSel').value;
    if(!name){ setStatus('削除するテンプレートを選択してください。',true); return; }
    if(!confirm('テンプレート「'+name+'」を削除しますか？')) return;
    jsonp(apiUrl(), {action:'tpl_del', name:name}).then(function(){ setStatus('削除しました。'); tplRefresh(); })
      .catch(function(e){ setStatus('削除失敗: '+e.message,true); });
  }

  /* ---- 背景 ---- */
  function bgUpload(ev){
    var f=ev.target.files&&ev.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){ document.getElementById('board').style.backgroundImage='url('+r.result+')'; setStatus('背景を差し替えました。'); };
    r.readAsDataURL(f);
  }
  function bgReset(){ document.getElementById('board').style.backgroundImage=BG_DEFAULT?'url('+BG_DEFAULT+')':'none'; setStatus('背景を既定に戻しました。'); }

  /* ---- 出力 ---- */
  async function fontsReady(){
    try{ await Promise.all([
      document.fonts.load('900 46px "Noto Sans JP"'),
      document.fonts.load('700 24px "Noto Sans JP"'),
      document.fonts.load('400 18px "Noto Sans JP"')
    ]); await document.fonts.ready; }catch(e){}
  }
  function copyForX(){
    if(!items.length){ setStatus('先にBOXを追加してください。',true); return; }
    var lines=items.slice(0,MAX).map(function(x){
      var nm=(x.name||'').trim();
      var price=isNum(x.buy)?('¥'+yen(x.buy)):'';
      return nm + (price?(' '+price):'');
    });
    var text=lines.join('\n');
    function done(){ setStatus('X用テキストをコピーしました（'+lines.length+'件）。'); }
    function fallback(){
      var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      try{ document.execCommand('copy'); done(); }catch(e){ setStatus('コピー失敗。手動で選択してください。',true); }
      document.body.removeChild(ta);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(fallback); }
    else fallback();
  }

  async function exportPng(){
    if(!items.length){ setStatus('先にBOXを追加してください。',true); return; }
    setStatus('画像を生成中…');
    document.body.classList.add('exporting');
    try{
      await fontsReady();
      var board=document.getElementById('board');
      var canvas=await html2canvas(board,{
        scale:1, width:1240, height:1754, useCORS:true, backgroundColor:'#ffffff', logging:false,
        onclone:function(doc){ var cb=doc.getElementById('board'); if(cb){ cb.style.transform='none'; } }
      });
      var d=new Date();
      var stamp=''+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
      var a=document.createElement('a'); a.download='kaitori_'+stamp+'.png'; a.href=canvas.toDataURL('image/png'); a.click();
      setStatus('画像を保存しました（A4縦・1240×1754）。Xに貼れます。');
    }catch(e){ setStatus('画像生成に失敗: '+e.message,true); }
    finally{ document.body.classList.remove('exporting'); }
  }

  fitBoard();
</script>
</body>
